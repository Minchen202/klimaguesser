<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        :root {
            --timer-duration: 60s;
        }

        .hexagon-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 80px;
            height: 80px;
            position: relative;
        }

        .hexagon-svg {
            width: 100%;
            height: 100%;
            position: absolute;
        }

        .border {
            fill: none;
            stroke: #4CAF50;
            stroke-width: 8;
            stroke-dasharray: 1000;
            stroke-dashoffset: 0;
            transition: stroke 0.5s ease;
        }

        .border.warning {
            stroke: #f44336;
        }

        .timer-text {
            font-family: sans-serif;
            font-size: 2rem;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="hexagon-container">
        <svg class="hexagon-svg" viewBox="0 0 300 300">
            <!-- Hexagon path -->
            <polygon class="border" id="hexBorder" points="150,10 280,80 280,220 150,290 20,220 20,80" />
        </svg>
        <div class="timer-text" id="timer">60</div>
    </div>

    <script>
        const duration = 60; // seconds
        let timeLeft = duration;
        const timerDisplay = document.getElementById('timer');
        const border = document.getElementById('hexBorder');

        const totalLength = border.getTotalLength();
        border.style.strokeDasharray = totalLength;

        const countdown = setInterval(() => {
            timeLeft--;
            timerDisplay.textContent = timeLeft;

            // Update border offset
            const offset = totalLength - (timeLeft / duration) * totalLength;
            border.style.strokeDashoffset = offset;

            // Change to red at 10 seconds
            if (timeLeft <= 10) {
                border.classList.add('warning');
            }

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.textContent = "0";
            }
        }, 1000);
    </script>
</body>
</html>
